name: 15-Minute Signal Scan

on:
  schedule:
    - cron: "*/15 * * * *"   # 00/15/30/45 (GitHub may add a few minutes of jitter — recorded by the engine)
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "frontend/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Engine is stdlib-only: nothing to install for the scan itself.
      - name: Run signal scanner (Binance public market data)
        run: python -m scanner.main

      - name: Validate generated JSON
        run: python -m scanner.validate_data

      - name: Build single-file dashboard preview
        run: python -m scanner.build_preview

      - name: Commit and push data updates
        run: |
          git config user.name  "signal-scanner[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data frontend/data frontend/preview.html
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            STAMP="$(date -u +'%Y-%m-%d %H:%M')"
            git commit -m "chore: update market scan ${STAMP}"
            git pull --rebase origin ${GITHUB_REF_NAME:-main} || true
            git push
          fi
